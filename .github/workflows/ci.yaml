name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

# Build and test run in one job per platform, on the same self-hosted runner —
# no artifact upload/download (the runners are single machines, so build and
# test would run back-to-back anyway, and this keeps CI independent of the
# Actions artifact storage quota).

jobs:
  linux:
    runs-on: [self-hosted, linux]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    # Hermetic clean build every run. The runner's workspace persists across
    # runs; stale build output and — critically — stale in-source artifacts in
    # the submodules (which actions/checkout does not git-clean) break the
    # third-party builds (e.g. dropbear's libtomcrypt Makefile uses VPATH into
    # the source tree, so a leftover in-source libtomcrypt.a makes `make` skip
    # building it into the build dir, and the link then can't find it).
    - name: clean workspace
      run: |
        rm -rf output flutter/build
        git submodule foreach --recursive git clean -ffdx
    - name: build
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm
    - name: test_rmem
      run: ./output/linux-x64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  macos:
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    # See linux: hermetic clean build (also clears stale in-source submodule
    # artifacts that break the third-party builds).
    - name: clean workspace
      run: |
        rm -rf output flutter/build
        git submodule foreach --recursive git clean -ffdx
    - name: build
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli flutter
    - name: test_tvm
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm
    - name: test_rmem
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true
    # build.py -t flutter builds the macOS app and symlinks it at
    # output/macos-arm64/lib/flutter, the path the harness (FLUTTER_APP) uses.
    - name: test_integration (flutter)
      run: pytest tests/test_integration.py -v --backend flutter --junitxml=report-flutter.xml
    - name: test report (flutter)
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report-flutter.xml
        annotate_only: true

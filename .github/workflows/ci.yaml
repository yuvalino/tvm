name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

jobs:
  build-linux:
    runs-on: [self-hosted, linux]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux-x64
        path: output/

  build-macos:
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli flutter
    - uses: actions/upload-artifact@v4
      with:
        name: build-macos-arm64
        path: output/
    # Tar the .app for transit: upload-artifact does not reliably preserve the
    # bundle's internal framework symlinks / executable bits.
    - name: package flutter app
      run: tar -C flutter/build/macos/Build/Products/Release -czf tvm-app-macos-arm64.tar.gz tvm.app
    - uses: actions/upload-artifact@v4
      with:
        name: flutter-macos-arm64
        path: tvm-app-macos-arm64.tar.gz

  test-linux:
    needs: build-linux
    runs-on: [self-hosted, linux]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-x64
        path: output/
    - run: chmod +x output/linux-x64/bin/*
    - name: test_tvm
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm
    - name: test_rmem
      run: ./output/linux-x64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  test-macos:
    needs: build-macos
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-macos-arm64
        path: output/
    - run: chmod +x output/macos-arm64/bin/*
    - name: test_tvm
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm
    - name: test_rmem
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  test-flutter:
    needs: test-macos
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: flutter-macos-arm64
        path: .
    # Unpack the .app and expose it at output/<arch>/lib/flutter, the path the
    # test harness (FLUTTER_APP) expects — build.py normally symlinks it there.
    - name: unpack flutter app into output layout
      run: |
        mkdir -p flutter/build/macos/Build/Products/Release
        tar -C flutter/build/macos/Build/Products/Release -xzf tvm-app-macos-arm64.tar.gz
        mkdir -p output/macos-arm64/lib
        ln -sfn "$PWD/flutter/build/macos/Build/Products/Release/tvm.app" output/macos-arm64/lib/flutter
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration (flutter)
      run: pytest tests/test_integration.py -v --backend flutter --junitxml=report-flutter.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report-flutter.xml
        annotate_only: true

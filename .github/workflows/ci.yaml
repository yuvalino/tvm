name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

# The runners are self-hosted (one machine per platform), so a superseded run
# left in-progress hogs the runner and makes later runs queue behind it. Cancel
# the older run for the same ref when a new one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Build and test run in one job per platform, on the same self-hosted runner —
# no artifact upload/download (the runners are single machines, so build and
# test would run back-to-back anyway, and this keeps CI independent of the
# Actions artifact storage quota).

jobs:
  linux:
    runs-on: [self-hosted, linux]
    # Hard backstop: the runners are self-hosted, so a hung job (e.g. a test
    # deadlock) is NOT auto-cancelled by GitHub's 6h limit — it blocks the
    # single runner for every later run until manually cancelled. Cap it above
    # the sum of the per-step timeouts (build 10 + tests 3+3 + integration 10).
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    # Hermetic clean build every run. The runner's workspace persists across
    # runs; stale build output and — critically — stale in-source artifacts in
    # the submodules (which actions/checkout does not git-clean) break the
    # third-party builds (e.g. dropbear's libtomcrypt Makefile uses VPATH into
    # the source tree, so a leftover in-source libtomcrypt.a makes `make` skip
    # building it into the build dir, and the link then can't find it).
    - name: clean workspace
      run: |
        # Self-hosted runners accumulate orphaned processes from prior hung/cancelled
        # runs (clean-workspace only cleans files). A leftover tvm/dropbear can hold
        # the SSH port and make the integration tests hang. Kill strays first.
        pkill -9 -f 'bin/tvm|bin/test_tvm|bin/test_rmem|dropbear|initrc' 2>/dev/null || true
        rm -rf output flutter/build
        git submodule foreach --recursive git clean -ffdx
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    # -t 30: per-subtest timeout inside the harness — a hung subtest is SIGKILLed
    # and reported as TIMEOUT rather than hanging the step. Step timeout is the
    # outer backstop.
    - name: test_tvm
      timeout-minutes: 5
      # TEMP DIAGNOSTIC: cache fix didn't budge the crash — show the [warm] line
      # (did the constructor populate get_text's cache?) and the true fatal frame.
      run: |
        cat > /tmp/g.py <<'PY'
        import gdb
        gdb.execute("set pagination off"); gdb.execute("set width 0")
        for s in ["SIGTERM","SIGINT","SIGUSR1","SIGUSR2","SIGCHLD","SIGCONT","SIGHUP","SIGQUIT","SIGALRM","SIGPIPE","SIGTSTP","SIGTTIN","SIGTTOU","SIGWINCH","SIGURG"]:
            gdb.execute("handle %s nostop noprint pass" % s)
        for s in ["SIGSEGV","SIGBUS","SIGILL","SIGFPE","SIGABRT"]:
            gdb.execute("handle %s stop print pass" % s)
        gdb.execute("run")
        n = 0
        while n < 400:
            n += 1
            try:
                gdb.selected_frame()
            except gdb.error:
                print("=== NO FRAME / exited at stop %d ===" % n); break
            print("=== STOP #%d ===" % n)
            try:
                gdb.execute("bt 16"); gdb.execute("info registers rip r13 r14 r15")
            except gdb.error as e:
                print("=== bt error: %s ===" % e)
            try:
                gdb.execute("continue")
            except gdb.error as e:
                print("=== TERMINATED after stop %d: %s ===" % (n, e)); break
        PY
        RC=0; timeout -s KILL 240 gdb -batch -nx -x /tmp/g.py --args ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm -t 30 > /tmp/tt.out 2>&1 || RC=$?
        echo "===== gdb rc=$RC ; total stops: $(grep -c '=== STOP' /tmp/tt.out) ====="
        echo "===== [warm] lines (constructor cache result) ====="; grep -a "\[warm\]" /tmp/tt.out | head
        echo "===== LAST (fatal) stop ====="
        sed -E 's#/home/[^ ]*/tvm/tvm/tvm.c#tvm.c#g' /tmp/tt.out | awk '/=== STOP|=== TERMINATED|=== NO FRAME/{seg=$0"\n";grab=1;next} grab{seg=seg $0"\n"} /rip /{if(grab){last=seg;grab=0}} END{print last}'
        echo "===== signals seen ====="; grep -oE "received signal SIG[A-Z]+" /tmp/tt.out | sort | uniq -c
        exit 1
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/linux-x64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  macos:
    runs-on: [self-hosted, macOS]
    # See linux: self-hosted runners have no auto-cancel; cap hung jobs. Larger
    # budget than linux — this job also builds the Flutter app and runs the
    # flutter integration pass (build 10 + tests 3+3 + integration 10 + 20).
    timeout-minutes: 55
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    # See linux: hermetic clean build (also clears stale in-source submodule
    # artifacts that break the third-party builds).
    - name: clean workspace
      run: |
        # Self-hosted runners accumulate orphaned processes from prior hung/cancelled
        # runs (clean-workspace only cleans files). A leftover tvm/dropbear can hold
        # the SSH port and make the integration tests hang. Kill strays first.
        pkill -9 -f 'bin/tvm|bin/test_tvm|bin/test_rmem|dropbear|initrc' 2>/dev/null || true
        rm -rf output flutter/build
        git submodule foreach --recursive git clean -ffdx
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli flutter
    # -t 30: per-subtest harness timeout (see linux job).
    - name: test_tvm
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true
    # build.py -t flutter builds the macOS app and symlinks it at
    # output/macos-arm64/lib/flutter, the path the harness (FLUTTER_APP) uses.
    - name: test_integration (flutter)
      timeout-minutes: 20
      run: pytest tests/test_integration.py -v --backend flutter --junitxml=report-flutter.xml
    - name: test report (flutter)
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report-flutter.xml
        annotate_only: true

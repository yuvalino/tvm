name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

jobs:
  build-linux:
    runs-on: [self-hosted, linux]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem initrd
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux-x64
        path: output/

  build-macos:
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem initrd flutter
    - uses: actions/upload-artifact@v4
      with:
        name: build-macos-arm64
        path: output/
    - uses: actions/upload-artifact@v4
      with:
        name: flutter-macos-arm64
        path: flutter/build/macos/Build/Products/Debug/tvm.app/

  test-linux:
    needs: build-linux
    runs-on: [self-hosted, linux]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-linux-x64
        path: output/
    - run: chmod +x output/linux-x64/bin/*
    - name: test_tvm
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm
    - name: test_rmem
      run: ./output/linux-x64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  test-macos:
    needs: build-macos
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-macos-arm64
        path: output/
    - run: chmod +x output/macos-arm64/bin/*
    - name: test_tvm
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm
    - name: test_rmem
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  test-flutter:
    needs: test-macos
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: flutter-macos-arm64
        path: flutter/build/macos/Build/Products/Debug/tvm.app/
    - run: chmod +x flutter/build/macos/Build/Products/Debug/tvm.app/Contents/MacOS/tvm
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration (flutter)
      run: TVM_INTEG_BACKEND=flutter pytest tests/test_integration.py -v --junitxml=report-flutter.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report-flutter.xml
        annotate_only: true

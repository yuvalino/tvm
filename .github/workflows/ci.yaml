name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

jobs:
  tvm-test:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem
    - name: test_tvm
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm
    - name: test_rmem
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_rmem

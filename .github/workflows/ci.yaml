name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      timeout-minutes: 5
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/linux-x64/bin/test_rmem
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: deps
      run: brew install ninja cmake gnu-sed openssl
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

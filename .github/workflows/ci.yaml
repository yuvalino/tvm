name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      timeout-minutes: 5
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/linux-x64/bin/test_rmem
    - name: check initrd symlinks
      run: |
        python3 -c "
        with open('output/linux-x64/lib/initrd.cli.cpio', 'rb') as f:
            data = f.read()
        pos = 0
        syms = 0
        while pos + 110 < len(data):
            if data[pos:pos+6] != b'070701': break
            mode = int(data[pos+14:pos+22], 16)
            filesize = int(data[pos+54:pos+62], 16)
            namesize = int(data[pos+94:pos+102], 16)
            name = data[pos+110:pos+110+namesize-1].decode('ascii', errors='replace')
            padded = ((110 + namesize + 3) // 4) * 4
            if (mode & 0o170000) == 0o120000:
                target = data[pos+padded:pos+padded+filesize].decode('ascii', errors='replace')
                print(f'SYMLINK {name} -> {target} (filesize={filesize})')
                syms += 1
                if filesize == 0: print(f'  ERROR: zero filesize!')
            if name == 'TRAILER!!!': break
            pos += padded + ((filesize + 3) // 4) * 4
        print(f'Total symlinks: {syms}')
        "
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: deps
      run: brew install ninja cmake gnu-sed openssl
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm -t 30
      continue-on-error: true
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

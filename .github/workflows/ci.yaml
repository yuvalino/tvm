name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: deps
      # autotools for the less and nano git trees (scripts/build_less.sh,
      # scripts/build_nano.sh generate their configure scripts)
      run: sudo apt-get update && sudo apt-get install -y autoconf automake autopoint gettext pkg-config
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: debug per-test
      continue-on-error: true
      timeout-minutes: 40
      shell: bash
      run: |
        T=./output/linux-x64/bin/test_tvm
        pertest() {  # $1: tvm binary, $2: label
          for k in $($T -l | grep -o '[A-Za-z0-9_]*$' | tail -n +2); do
            r=0; timeout 60 $1 $T -t 30 -k $k > /tmp/o.txt 2>&1 || r=$?
            [ $r = 0 ] || { echo "[$2] $k rc=$r"; tail -c 800 /tmp/o.txt; }
          done
          echo "[$2] per-test done"
        }
        sighup() {  # $1: tvm binary, $2: label
          for i in 1 2 3 4 5; do
            r=0; timeout 30 $1 --verbose $T -t 20 -k TTYSighupRace > /tmp/v.txt 2>&1 || r=$?
            echo "[$2] TTYSighupRace #$i rc=$r"
            [ $r = 0 ] || grep -v initrc_ /tmp/v.txt | tail -40
          done
        }
        cp ./output/linux-x64/bin/tvm /tmp/tvm_new
        pertest /tmp/tvm_new new
        sighup /tmp/tvm_new new
        git fetch -q --depth=1 origin ui
        F="tvm/tvm.c tvm/ulinker.c tvm/ulinker.h tvm/CMakeLists.txt"
        for f in $F; do git show FETCH_HEAD:$f > $f; done; touch $F
        ninja -C output/linux-x64/build tvm_exe > /tmp/uibuild.txt 2>&1 || tail -30 /tmp/uibuild.txt
        cp ./output/linux-x64/bin/tvm /tmp/tvm_ui
        git checkout -- $F; touch $F
        ninja -C output/linux-x64/build tvm_exe > /dev/null 2>&1
        cmp -s ./output/linux-x64/bin/tvm /tmp/tvm_ui && echo "restore FAILED" || echo "restored new tvm"
        sighup /tmp/tvm_ui ui
        pertest /tmp/tvm_ui ui
    - name: test_tvm
      timeout-minutes: 5
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/linux-x64/bin/test_rmem
    - name: check initrd vfs
      run: |
        ./output/linux-x64/bin/tvm sh -c '
          echo "=== VFS test ==="
          test -e /tvm/bin/toybox && echo "toybox: exists" || echo "toybox: MISSING"
          test -L /tvm/bin/cat && echo "cat: is symlink" || echo "cat: NOT symlink"
          test -e /tvm/bin/cat && echo "cat: exists" || echo "cat: MISSING"
          readlink /tvm/bin/cat 2>&1 || echo "readlink failed"
          /tvm/bin/toybox echo "toybox direct: OK" 2>&1 || echo "toybox direct: FAILED ($?)"
          /tvm/bin/cat /dev/null 2>&1 && echo "cat: OK" || echo "cat: FAILED"
        ' 2>&1 || echo "VFS test exited with $?"
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  macos:
    if: false
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: deps
      run: brew install ninja cmake gnu-sed autoconf automake gettext pkg-config
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

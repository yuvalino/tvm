name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem initrd
    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/

  test_tvm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/
    - run: chmod +x output/${{ matrix.platform }}/bin/*
    - name: test_tvm
      run: ./output/${{ matrix.platform }}/bin/tvm ./output/${{ matrix.platform }}/bin/test_tvm

  test_rmem:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/
    - run: chmod +x output/${{ matrix.platform }}/bin/*
    - name: test_rmem
      run: ./output/${{ matrix.platform }}/bin/test_rmem

  test_integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/
    - run: chmod +x output/${{ matrix.platform }}/bin/*
    - name: pip
      run: pip install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v

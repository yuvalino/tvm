name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: [self-hosted, linux]
          - platform: macos-arm64
            runner: [self-hosted, macOS]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem initrd
    - uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/

  test_tvm:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: [self-hosted, linux]
          - platform: macos-arm64
            runner: [self-hosted, macOS]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/
    - run: chmod +x output/${{ matrix.platform }}/bin/*
    - name: test_tvm
      run: ./output/${{ matrix.platform }}/bin/tvm ./output/${{ matrix.platform }}/bin/test_tvm

  test_rmem:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: [self-hosted, linux]
          - platform: macos-arm64
            runner: [self-hosted, macOS]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/
    - run: chmod +x output/${{ matrix.platform }}/bin/*
    - name: test_rmem
      run: ./output/${{ matrix.platform }}/bin/test_rmem

  test_integration:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: [self-hosted, linux]
          - platform: macos-arm64
            runner: [self-hosted, macOS]
    runs-on: ${{ matrix.runner }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-${{ matrix.platform }}
        path: output/
    - run: chmod +x output/${{ matrix.platform }}/bin/*
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration
      run: pytest tests/test_integration.py -v --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  build_flutter:
    needs: build
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-macos-arm64
        path: output/
    - run: chmod +x output/macos-arm64/bin/*
    - name: build flutter
      run: python3 build.py -t flutter
    - uses: actions/upload-artifact@v4
      with:
        name: flutter-macos-arm64
        path: flutter/build/macos/Build/Products/Debug/tvm.app/

  test_integration_flutter:
    needs: build_flutter
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: flutter-macos-arm64
        path: flutter/build/macos/Build/Products/Debug/tvm.app/
    - run: chmod +x flutter/build/macos/Build/Products/Debug/tvm.app/Contents/MacOS/tvm
    - name: pip
      run: pip3 install -r python_requirements.txt
    - name: test_integration (flutter)
      run: TVM_INTEG_BACKEND=flutter pytest tests/test_integration.py -v --junitxml=report-flutter.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report-flutter.xml
        annotate_only: true

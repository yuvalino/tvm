name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem initrd
    - uses: actions/upload-artifact@v4
      with:
        name: build-linux
        path: output/

  build-macos:
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - name: build
      run: python3 build.py -t tvm test_tvm test_rmem initrd
    - uses: actions/upload-artifact@v4
      with:
        name: build-macos
        path: output/

  test_tvm-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-linux
        path: output/
    - run: chmod +x output/linux-x64/bin/*
    - name: test_tvm
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm

  test_tvm-macos:
    needs: build-macos
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-macos
        path: output/
    - run: chmod +x output/macos-arm64/bin/*
    - name: test_tvm
      run: TVM_NOEMU=1 ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm -t 20

  test_rmem-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-linux
        path: output/
    - run: chmod +x output/linux-x64/bin/*
    - name: test_rmem
      run: ./output/linux-x64/bin/test_rmem

  test_rmem-macos:
    needs: build-macos
    runs-on: macos-14
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: build-macos
        path: output/
    - run: chmod +x output/macos-arm64/bin/*
    - name: test_rmem
      run: ./output/macos-arm64/bin/test_rmem

  test_integration-linux:
    needs: build-linux
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-linux
        path: output/
    - run: chmod +x output/linux-x64/bin/*
    - name: pip
      run: pip install -r python_requirements.txt
    - name: test_integration
      run: TVM_NOEMU=1 pytest tests/test_integration.py -v

  test_integration-macos:
    needs: build-macos
    runs-on: macos-14
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        token: ${{ secrets.SUBMODULE_TOKEN }}
    - uses: actions/download-artifact@v4
      with:
        name: build-macos
        path: output/
    - run: chmod +x output/macos-arm64/bin/*
    - name: pip
      run: pip install -r python_requirements.txt
    - name: test_integration
      run: TVM_BIN=./output/macos-arm64/bin/tvm TVM_NOEMU=1 pytest tests/test_integration.py -v

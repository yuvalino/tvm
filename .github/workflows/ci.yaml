name: CI

on:
  push:
      branches: [ main ]
  pull_request:
      branches: [ main ]

permissions:
  checks: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: deps
      # autotools for the less and nano git trees (scripts/build_less.sh,
      # scripts/build_nano.sh generate their configure scripts)
      run: sudo apt-get update && sudo apt-get install -y autoconf automake autopoint gettext pkg-config
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: debug task-only abort
      continue-on-error: true
      timeout-minutes: 5
      shell: bash
      run: |
        grep -m1 "model name" /proc/cpuinfo
        grep -m1 flags /proc/cpuinfo
        uname -a
        /lib64/ld-linux-x86-64.so.2 --version | head -1
        r=0; timeout 60 ./output/linux-x64/bin/tvm --verbose ./output/linux-x64/bin/test_tvm -t 30 -k FreeHostPointerAbortsTaskOnly > /tmp/fa.log 2>&1 || r=$?
        echo "rc=$r"
        cat /tmp/fa.log
        line=$(grep "DEBUG invalid stop: found" /tmp/fa.log | head -1)
        fname=$(sed -E 's/.*fname=([^ ]*).*/\1/' <<<"$line")
        off=$(sed -E 's/.*off=(0x[0-9a-f]*).*/\1/' <<<"$line")
        echo "fname=$fname off=$off"
        if [ -f "$fname" ]; then
          objdump -d -l --start-address=$((off-0x60)) --stop-address=$((off+0x20)) "$fname"
        fi
    - name: test_tvm
      timeout-minutes: 5
      run: ./output/linux-x64/bin/tvm ./output/linux-x64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/linux-x64/bin/test_rmem
    - name: check initrd vfs
      run: |
        ./output/linux-x64/bin/tvm sh -c '
          echo "=== VFS test ==="
          test -e /tvm/bin/toybox && echo "toybox: exists" || echo "toybox: MISSING"
          test -L /tvm/bin/cat && echo "cat: is symlink" || echo "cat: NOT symlink"
          test -e /tvm/bin/cat && echo "cat: exists" || echo "cat: MISSING"
          readlink /tvm/bin/cat 2>&1 || echo "readlink failed"
          /tvm/bin/toybox echo "toybox direct: OK" 2>&1 || echo "toybox direct: FAILED ($?)"
          /tvm/bin/cat /dev/null 2>&1 && echo "cat: OK" || echo "cat: FAILED"
        ' 2>&1 || echo "VFS test exited with $?"
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
    - name: deps
      run: brew install ninja cmake gnu-sed autoconf automake gettext pkg-config
    - name: build
      timeout-minutes: 10
      run: python3 build.py -t tvm_exe test_tvm test_rmem initrd_cli
    - name: test_tvm
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/tvm ./output/macos-arm64/bin/test_tvm -t 30
    - name: test_rmem
      timeout-minutes: 3
      run: ./output/macos-arm64/bin/test_rmem
    - name: pip
      run: pip3 install --break-system-packages -r python_requirements.txt
    - name: test_integration
      timeout-minutes: 10
      run: pytest tests/test_integration.py -v --maxfail=3 --junitxml=report.xml
    - name: test report
      uses: mikepenz/action-junit-report@v5
      if: always()
      with:
        report_paths: report.xml
        annotate_only: true

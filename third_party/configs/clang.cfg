# TVM's clang configuration: /tvm/etc/clang/clang.cfg, clang++.cfg and
# clang-cpp.cfg, which clang reads at every run (CLANG_CONFIG_FILE_SYSTEM_DIR,
# see scripts/build_llvm.sh). Generated from third_party/configs/clang.cfg.

# The toolchain bundle at /tvm/llvm (init.rc / init.flutter.rc): clang's
# resource directory -- its own default, next to the executable, is the
# app's Frameworks directory in the Flutter apps -- and the SDK.
-resource-dir /tvm/llvm/lib/clang/@TVM_LLVM_MAJOR@
-isysroot /tvm/llvm/sdk

# lld, which is the same program (ld64.lld); clang's default is ld.
-fuse-ld=lld

# The deployment target the runtimes in the SDK were built for: the SDK's own
# version (clang's default) would let programs use what the device's
# libSystem may not have yet.
@TVM_CLANG_MIN_VERSION_FLAG@

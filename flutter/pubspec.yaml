name: tvm
description: "TVM - virtual machine environment with SSH server."
publish_to: 'none'

version: 1.0.0+10

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  ffi: ^2.1.0
  shared_preferences: ^2.3.4
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/init.flutter.rc
    - path: assets/initrd.flutter.ios-arm64.cpio
      platforms:
        - ios
    - path: assets/initrd.flutter.macos-arm64.cpio
      platforms:
        - macos
